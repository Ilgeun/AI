# raw/sources/{source-id}/metadata.yaml 템플릿
# 원본 파일 옆에 두는 정보 파일. 사람이 채워도 되고, Ingest 때 LLM이 만들어도 된다.
source_id: example-source-2026        # 폴더 이름과 같게
title: "원본 제목 (원문 그대로)"
issuer: ""                             # 발행 기관·부서, 예: 정보컴퓨터공학부 학사지원실
url: ""                                # 원문 URL (있으면)
published: YYYY-MM-DD                  # 발행·게시일 (모르면 비움)
collected: YYYY-MM-DD                  # 수집일
format: pdf                            # pdf | html | md | hwp | xlsx | image ...
tier: A                                # raw/sources/는 공식 자료(A)만
applies_to: ""                         # 적용 대상, 예: "2024학번 이후 입학생"
valid_from: YYYY-MM-DD                 # 모르면 비움
valid_until: ""                        # 기한 없음이면 비움, 모르면 "확인 필요"
supersedes: []                         # 이 원본이 대체하는 이전 source-id
files:                                 # 이 폴더의 원본 파일 목록
  - original.pdf
notes: ""
